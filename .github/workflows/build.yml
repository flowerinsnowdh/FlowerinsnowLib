name: 'Build'

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:

    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      packages: 'write'

    steps:
      - uses: 'actions/checkout@v6'

      - uses: 'actions/setup-java@v5'
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: 'gradle/actions/wrapper-validation@v5'

      - run: |
          chmod +x gradlew

      - run: |
          ./gradlew build

      - run: |
          ./gradlew publish
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
